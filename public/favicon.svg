<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E3C3" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A7418" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123B35" />
      <stop offset="100%" stop-color="#071816" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Base Badge -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>
  <rect width="476" height="476" x="18" y="18" rx="110" fill="none" stroke="url(#gold-grad)" stroke-width="8" stroke-opacity="0.35"/>
  
  <!-- Elegant Monogram Motif -->
  <g transform="translate(256, 235)">
    <!-- Stylized Crown/Scissors Crest -->
    <path d="M-60,-90 L-30,-130 L0,-100 L30,-130 L60,-90 L30,-75 L0,-90 L-30,-75 Z" fill="url(#gold-grad)"/>
    
    <!-- SM Letters -->
    <text x="0" y="85" text-anchor="middle" font-family="'Space Grotesk', 'Playfair Display', Arial, sans-serif" font-weight="700" font-size="180" fill="url(#gold-grad)" letter-spacing="6">SM</text>
    
    <!-- Accent Line -->
    <rect x="-70" y="115" width="140" height="8" rx="4" fill="url(#gold-grad)" opacity="0.85"/>
  </g>
</svg>
